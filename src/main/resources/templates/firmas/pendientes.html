<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Firmas</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold text-secondary mb-0">Firmas pendientes</h2>
        <a th:href="@{/firmas}" class="btn btn-outline-secondary">Actualizar</a>
    </div>
    <div th:if="${mensajeExito}" class="alert alert-success fs-5" th:text="${mensajeExito}">Listo.</div>

    <div class="row g-4">
        <div class="col-lg-6">
            <h3 class="h5 fw-bold mb-3">Recepción <span class="badge text-bg-primary" th:text="${#lists.size(pendientesRecepcion)}">0</span></h3>
            <p class="text-muted small">El cliente deja el vehículo y confirma el estado de ingreso.</p>
            <div th:if="${#lists.isEmpty(pendientesRecepcion)}" class="text-muted">No hay recepciones pendientes.</div>
            <div class="list-group">
                <a th:each="o : ${pendientesRecepcion}"
                   th:href="@{'/ordenes/' + ${o.id} + '/firmar/recepcion'(volver='/firmas')}"
                   class="list-group-item list-group-item-action py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold fs-5" th:text="${o.cliente.nombre}">Cliente</div>
                            <div class="text-muted"
                                 th:text="${o.id + ' · ' + (o.vehiculo != null ? o.vehiculo.patente + ' ' + o.vehiculo.marca + ' ' + o.vehiculo.modelo : 'Cremallera')}">ORD-001</div>
                        </div>
                        <span class="btn btn-primary btn-lg">Firmar</span>
                    </div>
                </a>
            </div>
        </div>
        <div class="col-lg-6">
            <h3 class="h5 fw-bold mb-3">Retiro <span class="badge text-bg-success" th:text="${#lists.size(pendientesRetiro)}">0</span></h3>
            <p class="text-muted small">Órdenes listas: el cliente retira y firma conforme.</p>
            <div th:if="${#lists.isEmpty(pendientesRetiro)}" class="text-muted">No hay retiros pendientes.</div>
            <div class="list-group">
                <a th:each="o : ${pendientesRetiro}"
                   th:href="@{'/ordenes/' + ${o.id} + '/firmar/retiro'(volver='/firmas')}"
                   class="list-group-item list-group-item-action py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold fs-5" th:text="${o.cliente.nombre}">Cliente</div>
                            <div class="text-muted"
                                 th:text="${o.id + ' · ' + (o.vehiculo != null ? o.vehiculo.patente + ' ' + o.vehiculo.marca + ' ' + o.vehiculo.modelo : 'Cremallera')}">ORD-001</div>
                        </div>
                        <span class="btn btn-success btn-lg">Firmar</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
