<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Clientes</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="fw-bold text-secondary mb-4">Clientes</h2>

    <form th:action="@{/clientes}" method="get" class="d-flex gap-2 mb-4" style="max-width:600px">
        <input type="search" name="q" class="form-control" th:value="${q}"
               placeholder="Buscar por nombre, teléfono o RUT" autofocus>
        <button type="submit" class="btn btn-primary">Buscar</button>
        <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/clientes}" class="btn btn-outline-secondary">Limpiar</a>
    </form>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Nombre</th><th>RUT</th><th>Teléfono</th><th>Relación</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:if="${clientesPage.empty}">
                    <td colspan="5" class="text-center text-muted py-4">No se encontraron clientes.</td>
                </tr>
                <tr th:each="c : ${clientesPage.content}">
                    <td class="fw-semibold">
                        <a th:href="@{'/clientes/' + ${c.id}}" th:text="${c.nombre}">Nombre</a>
                    </td>
                    <td th:text="${c.rut ?: '—'}">RUT</td>
                    <td th:text="${c.telefono ?: '—'}">Teléfono</td>
                    <td th:text="${c.relacionVehiculo ?: '—'}">Relación</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{'/clientes/' + ${c.id}}" class="btn btn-sm btn-outline-secondary">Historial</a>
                        <a th:href="@{'/clientes/' + ${c.id} + '/editar'}" class="btn btn-sm btn-outline-primary">Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${clientesPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${clientesPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/clientes(q=${q}, page=${clientesPage.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${'Página ' + (clientesPage.number + 1) + ' de ' + clientesPage.totalPages}">1</span>
            </li>
            <li class="page-item" th:classappend="${clientesPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/clientes(q=${q}, page=${clientesPage.number + 1})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
