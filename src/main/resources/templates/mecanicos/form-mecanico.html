<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Mecánico</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card shadow-sm border-0 mx-auto" style="max-width:520px">
        <div class="card-body p-4">
            <h2 class="h4 fw-bold mb-3" th:text="${mecanico.id == null ? 'Nuevo mecánico' : 'Editar mecánico'}">Mecánico</h2>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}">Error</div>
            <form th:action="@{/mecanicos/guardar}" method="post">
                <input type="hidden" name="id" th:value="${mecanico.id}">
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" th:value="${mecanico.nombre}" required>
                </div>
                <div class="mb-3">
                    <label for="rut" class="form-label fw-semibold">RUT <span class="text-muted fw-normal">(opcional)</span></label>
                    <input type="text" id="rut" name="rut" class="form-control" th:value="${mecanico.rut}" placeholder="12.345.678-5">
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="activo" name="activo" value="true"
                           th:checked="${mecanico.estadoActivo == null or mecanico.estadoActivo}">
                    <label class="form-check-label" for="activo">Activo (aparece al registrar trabajos)</label>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/mecanicos}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary flex-grow-1">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
