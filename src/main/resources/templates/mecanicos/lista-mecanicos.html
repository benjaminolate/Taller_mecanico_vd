<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Mecánicos</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-secondary mb-0">Mecánicos</h2>
        <a th:href="@{/mecanicos/nuevo}" class="btn btn-success">Nuevo mecánico</a>
    </div>
    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}">Listo.</div>
    <p class="text-muted small">
        Los mecánicos inactivos no aparecen al registrar trabajos nuevos, pero se mantienen en el historial.
    </p>
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Nombre</th><th>RUT</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(mecanicos)}">
                    <td colspan="4" class="text-center text-muted py-4">Aún no hay mecánicos registrados.</td>
                </tr>
                <tr th:each="m : ${mecanicos}" th:classappend="${!m.estadoActivo} ? 'text-muted'">
                    <td class="fw-semibold" th:text="${m.nombre}">Nombre</td>
                    <td th:text="${m.rut ?: '—'}">RUT</td>
                    <td>
                        <span th:if="${m.estadoActivo}" class="badge text-bg-success">Activo</span>
                        <span th:unless="${m.estadoActivo}" class="badge text-bg-light border">Inactivo</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/mecanicos/' + ${m.id} + '/editar'}" class="btn btn-sm btn-outline-primary">Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
