<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Taller Demo</title>
    <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height:100vh">
<main class="container">
    <div class="card shadow border-0 mx-auto" style="max-width:400px">
        <div class="card-body p-4 p-md-5">
            <h1 class="h4 fw-bold text-center mb-1">Taller Demo</h1>
            <p class="text-muted text-center mb-1">Ingresa con tu usuario</p>
            <p class="small text-center text-secondary mb-4">Versión demo con datos ficticios.<br/>Usuarios: <code>jefe</code> / <code>jefedemo</code> · <code>empleado</code> / <code>empleadodemo</code></p>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                Usuario o contraseña incorrectos, o el usuario está desactivado.
            </div>
            <div th:if="${param.salir}" class="alert alert-success py-2">
                Cerraste sesión.
            </div>
            <div th:if="${param.usuarioCambiado}" class="alert alert-info py-2">
                Cambiaste tu nombre de usuario. Entra de nuevo con el usuario nuevo.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control form-control-lg"
                           autocomplete="username" autocapitalize="none" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control form-control-lg"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Ingresar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
