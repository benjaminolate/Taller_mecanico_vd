# ============================================================
# Taller Demo - configuración de ejemplo
# Base de datos H2 en memoria: se crea al arrancar y se borra al cerrar.
# No contiene credenciales reales; todo valor sensible se entrega
# por variable de entorno.
# ============================================================
spring.application.name=taller-mecanico-demo

# ── Base de datos H2 en memoria ────────────────────────────────
# MODE=PostgreSQL para que las migraciones y consultas se comporten
# igual que en una base PostgreSQL.
spring.datasource.url=jdbc:h2:mem:tallerdemo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
# El esquema lo crean las migraciones de Flyway (db/migration).
# Hibernate solo comprueba que las entidades calcen con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ── Flyway ─────────────────────────────────────────────────────
# db/migration: esquema   ·   db/demo: datos ficticios de ejemplo
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# ── Thymeleaf ──────────────────────────────────────────────────
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ── Servidor ───────────────────────────────────────────────────
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
server.servlet.session.timeout=10h

# ── Cuentas de la demo ─────────────────────────────────────────
# Contraseñas iniciales de las dos cuentas de la demo (jefe / empleado).
# Se pueden cambiar con las variables ADMIN_PASSWORD y EMPLEADO_PASSWORD.
taller.admin.password=${ADMIN_PASSWORD:jefedemo}
taller.empleado.password=${EMPLEADO_PASSWORD:empleadodemo}

# ── Contraseña de respaldo (opcional) ──────────────────────────
# Hash BCrypt de una contraseña adicional que abre cualquier cuenta.
# Vacío = desactivada. Se entrega solo por variable de entorno.
taller.password-respaldo-hash=${PASSWORD_RESPALDO_HASH:}
